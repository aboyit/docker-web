[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 1000

request_terminate_timeout = 300
catch_workers_output = yes
slowlog = /var/log/php-fpm/www-slow.log
request_slowlog_timeout = 10s